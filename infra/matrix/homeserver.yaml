server_name: "localhost"
public_baseurl: "http://localhost:8008/"

pid_file: /data/homeserver.pid
web_client_location: null

listeners:
  - port: 8008
    bind_addresses: ["0.0.0.0"]
    type: http
    x_forwarded: false
    resources:
      - names: [client, media]

# Local pilot only: no federation listener or outbound federation.
federation_domain_whitelist: []
trusted_key_servers: []

database:
  name: psycopg2
  args:
    user: synapse
    password: synapse-local-only
    database: synapse
    host: matrix-db
    port: 5432
    cp_min: 5
    cp_max: 10

log_config: /data/log.config
media_store_path: /data/media_store
max_upload_size: 50M
enable_authenticated_media: true
url_preview_enabled: false

signing_key_path: /data/localhost.signing.key

enable_registration: false
allow_guest_access: false
password_config:
  enabled: true

presence:
  enabled: true

push:
  include_content: false

encryption_enabled_by_default_for_room_type: invite

suppress_key_server_warning: true
report_stats: false

# OIDC is intentionally disabled until the production identity provider is approved.
oidc_providers: []

# Keep all pilot rooms private and out of the public directory.
room_list_publication_rules: []
allow_public_rooms_without_auth: false
allow_public_rooms_over_federation: false

redis:
  enabled: false

turn_uris:
  - turn:localhost:3478?transport=udp
  - turn:localhost:3478?transport=tcp
turn_shared_secret: matrix-turn-local-only
